$('start').onclick=start;$('again').onclick=start;$('resume').onclick=pause;const GAME_KEYS=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];addEventListener('keydown',e=>{if(GAME_KEYS.includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Escape')pause();if(e.code==='Enter'&&(state==='menu'||state==='over'))start()});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')pause()});
const map=$('map'),ctx=map.getContext('2d');function drawMap(){const s=map.width,c=s/2,scale=s/300;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#141c31';ctx.fillRect(0,0,s,s);ctx.setTransform(Math.cos(player.h)*scale,Math.sin(player.h)*scale,-Math.sin(player.h)*scale,Math.cos(player.h)*scale,c,c);const ci=Math.floor(player.x/CELL),cj=Math.floor(player.z/CELL);for(let i=ci-3;i<=ci+3;i++)for(let j=cj-3;j<=cj+3;j++){ctx.fillStyle=lot(i,j).park?'#203d31':'#0d1426';ctx.fillRect(i*CELL+HALF-player.x,j*CELL+HALF-player.z,CELL-ROAD,CELL-ROAD)}for(const cop of cops){let x=cop.x-player.x,z=cop.z-player.z,d=Math.hypot(x,z);if(d>130){x*=130/d;z*=130/d}ctx.fillStyle='#ff4056';ctx.beginPath();ctx.arc(x,z,5,0,Math.PI*2);ctx.fill()}ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ffc531';ctx.beginPath();ctx.moveTo(c,c-12);ctx.lineTo(c+7,c+7);ctx.lineTo(c-7,c+7);ctx.fill()}
reset();updateCity(0,0);const clock=new THREE.Clock(),camTarget=new THREE.Vector3(),camPos=new THREE.Vector3();let menuAngle=0;
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),blink=Math.floor(performance.now()/170)%2===0;shared.copRed.emissiveIntensity=blink?4:.15;shared.copBlue.emissiveIntensity=blink?.15:4;
if(state==='play'){const oldX=player.x,oldZ=player.z;drive(player,{gas:(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),steer:(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),hand:!!keys.Space},{max:50,acc:27,brake:48,turn:2.5},dt);const impact=collision(player,1.6);if(impact>8)damage((impact-8)*1.1);distance+=Math.hypot(player.x-oldX,player.z-oldZ);elapsed+=dt;wanted=Math.min(5,1+Math.floor(elapsed/25));spawnTimer-=dt;const wantedCount=[0,2,3,5,7,9][wanted];if(cops.length<wantedCount&&spawnTimer<=0){spawnCop();spawnTimer=3.2}let nearest=Infinity;for(const c of [...cops]){const d=ai(c,dt);collision(c,1.6);nearest=Math.min(nearest,d);if(d>300){scene.remove(c.root);cops.splice(cops.indexOf(c),1)}}for(let i=0;i<cops.length;i++)for(let j=i+1;j<cops.length;j++)pair(cops[i],cops[j],3.5);for(const c of cops)pair(player,c,3.5,v=>{if(v>5)damage(v*.65)});if(Math.hypot(player.vx,player.vz)<6&&nearest<9)bust+=dt;else bust=Math.max(0,bust-dt*1.5);if(nearest>65)health=Math.min(100,health+dt*2);if(bust>2.5)finish('busted');else if(health<=0)finish('wrecked');if(cops.length){const c=cops.reduce((a,b)=>Math.hypot(a.x-player.x,a.z-player.z)<Math.hypot(b.x-player.x,b.z-player.z)?a:b);siren.position.set(c.x,3,c.z);siren.color.setHex(blink?0xff4056:0x3b8bff);siren.intensity=34}else siren.intensity=0;}
if(state==='play'||state==='menu'||state==='over'){sync(player,dt);for(const c of cops)sync(c,dt);updateCity(player.x,player.z);const fx=Math.sin(player.h),fz=Math.cos(player.h);if(state==='menu'){menuAngle+=dt*.22;camera.position.set(Math.sin(menuAngle)*17,7,Math.cos(menuAngle)*17);camera.lookAt(0,1,0)}else{const sp=Math.hypot(player.vx,player.vz),back=12+sp*.055;camPos.set(player.x-fx*back,5.8+sp*.025,player.z-fz*back);camera.position.lerp(camPos,1-Math.exp(-6*dt));camTarget.set(player.x+fx*6,1.1,player.z+fz*6);if(screenShake>.01){camera.position.x+=(Math.random()-.5)*screenShake;camera.position.y+=(Math.random()-.5)*screenShake;screenShake*=Math.exp(-6*dt)}camera.lookAt(camTarget);const fov=62+Math.min(1,sp/48)*10;camera.fov+=(fov-camera.fov)*Math.min(1,dt*4);camera.updateProjectionMatrix()}}
damageFlash*=Math.exp(-4*dt);document.body.style.boxShadow=damageFlash>.015?`inset 0 0 90px rgba(255,50,70,${damageFlash})`:'';
if(state==='play'){hudTimer-=dt;if(hudTimer<=0){hudTimer=.07;hud.distance.textContent=Math.floor(distance)+' m';hud.time.textContent=format(elapsed);hud.cops.textContent=cops.length;hud.speed.textContent=Math.round(Math.hypot(player.vx,player.vz)*3.6);hud.health.style.width=health+'%';hud.health.style.background=health<30?'var(--red)':'var(--yellow)';hud.stars.innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<wanted?'on':''}">★</span>`).join('');hud.bust.style.opacity=bust>.05?'1':'0';hud.meter.style.width=(bust/2.5*100)+'%';drawMap()}}
renderer.render(scene,camera)}frame();
