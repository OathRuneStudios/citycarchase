<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endless Pursuit</title>
<style>
  :root{
    --navy:#0b1020; --panel:rgba(11,16,32,.78); --text:#eef1f8; --muted:#8d96b3;
    --taxi:#ffc531; --red:#ff3b4e; --blue:#3b8bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--navy);color:var(--text);font-family:Geist,system-ui,sans-serif}
  canvas#c{display:block;width:100%;height:100%}
  .mono{font-family:"Geist Mono",ui-monospace,monospace}
  .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #hud{position:fixed;inset:0;pointer-events:none}
  #hud[hidden]{display:none}
  .tl{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:10px;background:var(--panel);padding:14px 16px;border-radius:10px;backdrop-filter:blur(6px);min-width:180px}
  .stars{display:flex;gap:4px;font-size:20px;line-height:1}
  .stars span{color:#2a3252;transition:color .2s}
  .stars span.on{color:var(--taxi);text-shadow:0 0 10px rgba(255,197,49,.6)}
  .stat{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .stat .val{font-family:"Geist Mono",monospace;font-size:18px;font-weight:600}
  #map{position:absolute;top:16px;right:16px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(238,241,248,.15);background:var(--navy)}
  .br{position:absolute;right:16px;bottom:16px;background:var(--panel);padding:14px 18px;border-radius:10px;backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:190px}
  #speed{font-family:"Geist Mono",monospace;font-size:44px;font-weight:700;line-height:1;font-style:italic}
  .hp{width:100%;height:8px;background:#1c233d;border-radius:4px;overflow:hidden}
  #hpbar{height:100%;width:100%;background:var(--taxi);transition:width .15s}
  .hprow{display:flex;justify-content:space-between;width:100%}
  #bust{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .2s}
  #bust .lbl{color:var(--red);font-weight:700;font-size:13px}
  .meter{width:260px;height:10px;border-radius:5px;background:#1c233d;overflow:hidden}
  #bustbar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--red))}
  #flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,59,78,.55));opacity:0}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(11,16,32,.55);backdrop-filter:blur(3px)}
  .overlay[hidden]{display:none}
  .card{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;max-width:520px}
  .lightbar{display:flex;width:220px;height:6px;border-radius:3px;overflow:hidden}
  .lightbar i{flex:1;animation:flash .5s steps(1) infinite}
  .lightbar i:first-child{background:var(--red)}
  .lightbar i:last-child{background:var(--blue);animation-delay:.25s}
  @keyframes flash{0%{opacity:1}50%{opacity:.15}}
  h1{font-size:clamp(40px,9vw,84px);font-weight:800;font-style:italic;letter-spacing:-.03em;line-height:.9;text-transform:uppercase;text-wrap:balance}
  h1 em{color:var(--taxi);font-style:italic}
  .sub{color:var(--muted);font-size:16px;line-height:1.5;text-wrap:pretty}
  .keys{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px}
  .key{display:flex;align-items:center;justify-content:center;border-radius:8px;background:#1a2140;border:1px solid #2c365e;border-bottom-width:3px;font-family:"Geist Mono",monospace;font-weight:700;font-size:16px}
  .key.w{grid-column:2}
  .extra{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
  .extra b{color:var(--text);font-family:"Geist Mono",monospace;font-weight:600;background:#1a2140;border:1px solid #2c365e;border-radius:6px;padding:2px 8px;margin-right:6px}
  button.go{pointer-events:auto;cursor:pointer;border:0;border-radius:10px;background:var(--taxi);color:var(--navy);font:800 16px Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:14px 30px;transition:transform .1s}
  button.go:hover{transform:translateY(-1px)}
  button.go:focus-visible{outline:3px solid var(--text);outline-offset:3px}
  .result{display:flex;gap:28px}
  .result div{display:flex;flex-direction:column;gap:4px}
  .result .val{font-family:"Geist Mono",monospace;font-size:26px;font-weight:700}
  #overTitle{color:var(--red)}
  @media (max-width:640px){
    #map{width:120px;height:120px}
    .tl{min-width:150px;padding:10px 12px}
    .br{min-width:150px}
    #speed{font-size:32px}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c" aria-label="Car chase game view"></canvas>

<div id="hud" hidden>
  <div class="tl">
    <div class="stars" id="stars" aria-label="Wanted level"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
    <div class="stat"><span class="lbl">Distance</span><span class="val" id="dist">0 m</span></div>
    <div class="stat"><span class="lbl">Time</span><span class="val" id="time">0:00</span></div>
    <div class="stat"><span class="lbl">Cops</span><span class="val" id="cops">0</span></div>
  </div>
  <canvas id="map" width="360" height="360" aria-label="Minimap"></canvas>
  <div class="br">
    <div id="speed">0</div>
    <div class="lbl">km/h</div>
    <div class="hprow"><span class="lbl">Car health</span></div>
    <div class="hp"><div id="hpbar"></div></div>
  </div>
  <div id="bust"><div class="lbl">Getting busted — move!</div><div class="meter"><div id="bustbar"></div></div></div>
</div>
<div id="flash"></div>

<div id="menu" class="overlay">
  <div class="card">
    <div class="lightbar"><i></i><i></i></div>
    <h1>Endless<br><em>Pursuit</em></h1>
    <p class="sub">The city never ends. Neither do the cops. Outrun them, slip through the alleys, and don't stop moving or you're busted.</p>
    <div class="keys" aria-label="Controls: W accelerate, A left, S brake and reverse, D right">
      <div class="key w">W</div><div class="key">A</div><div class="key">S</div><div class="key">D</div>
    </div>
    <div class="extra"><span><b>Space</b>Handbrake drift</span><span><b>Esc</b>Pause</span></div>
    <button class="go" id="startBtn">Start the chase</button>
    <span class="lbl" id="bestMenu"></span>
  </div>
</div>

<div id="pause" class="overlay" hidden>
  <div class="card">
    <h1>Paused</h1>
    <button class="go" id="resumeBtn">Resume</button>
  </div>
</div>

<div id="over" class="overlay" hidden>
  <div class="card">
    <div class="lightbar"><i></i><i></i></div>
    <h1 id="overTitle">Busted</h1>
    <p class="sub" id="overSub"></p>
    <div class="result">
      <div><span class="lbl">Distance</span><span class="val" id="rDist">0 m</span></div>
      <div><span class="lbl">Survived</span><span class="val" id="rTime">0:00</span></div>
      <div><span class="lbl">Best</span><span class="val" id="rBest">0 m</span></div>
    </div>
    <button class="go" id="againBtn">Drive again (Enter)</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const CELL = 60, ROAD = 14, HALF = ROAD / 2, VIEW = 5;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
function hash(i, j, s = 0) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 110, 290);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 420);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

scene.add(new THREE.HemisphereLight(0x5a6aa8, 0x141018, 1.4));
const moon = new THREE.DirectionalLight(0x9fb2ff, 0.9);
moon.position.set(-40, 80, -20);
scene.add(moon);

/* ---------- textures ---------- */
function groundTexture() {
  const S = 512, px = S / CELL, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.fillStyle = '#1a1e2b'; g.fillRect(0, 0, S, S);
  for (let k = 0; k < 5000; k++) {
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.035})`;
    g.fillRect(Math.random() * S, Math.random() * S, 2, 2);
  }
  const rect = (x, z, w, h, col) => {
    g.fillStyle = col;
    for (const ox of [-CELL, 0, CELL]) for (const oz of [-CELL, 0, CELL])
      g.fillRect((x + ox) * px, (z + oz) * px, w * px, h * px);
  };
  for (let z = HALF + 3; z < CELL - HALF - 3; z += 6) {
    rect(-0.2, z, 0.4, 3, '#d9b447');
    rect(z, -0.2, 3, 0.4, '#d9b447');
  }
  for (const c of [HALF + 1, CELL - HALF - 4]) {
    for (let s = -HALF + 0.7; s < HALF - 0.5; s += 1.6) {
      rect(s, c, 0.8, 3, 'rgba(230,232,240,.55)');
      rect(c, s, 3, 0.8, 'rgba(230,232,240,.55)');
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function windowTextures(seed) {
  const W = 128, H = 256;
  const a = document.createElement('canvas'), e = document.createElement('canvas');
  a.width = e.width = W; a.height = e.height = H;
  const ga = a.getContext('2d'), ge = e.getContext('2d');
  ga.fillStyle = '#c9ccd6'; ga.fillRect(0, 0, W, H);
  ge.fillStyle = '#000'; ge.fillRect(0, 0, W, H);
  let r = seed * 9301 + 49297;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  for (let row = 0; row < 8; row++) for (let col = 0; col < 4; col++) {
    const x = col * 32 + 6, y = row * 32 + 8, w = 20, h = 17;
    const lit = rnd() < 0.42;
    if (lit) {
      const c = rnd() < 0.8 ? '#ffcf73' : '#a9cbff';
      ga.fillStyle = c; ge.fillStyle = c;
      ga.fillRect(x, y, w, h); ge.fillRect(x, y, w, h);
    } else {
      ga.fillStyle = '#1b2030'; ga.fillRect(x, y, w, h);
    }
  }
  const mk = cv => { const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
  return [mk(a), mk(e)];
}

const buildingMats = [];
const tints = [0x6b7390, 0x8a7f78, 0x5d6b7a, 0x7d8496];
for (let v = 0; v < 4; v++) {
  const [map, em] = windowTextures(v + 3);
  for (const tint of tints) {
    buildingMats.push(new THREE.MeshStandardMaterial({ color: tint, map, emissive: 0xffffff, emissiveMap: em, emissiveIntensity: 0.85, roughness: 0.85 }));
  }
}

const poolTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,176,80,0.55)'); gr.addColorStop(1, 'rgba(255,176,80,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
})();

/* ---------- shared geometry & materials ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(CELL * 24, CELL * 24),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 0.92 })
);
ground.material.map.repeat.set(24, 24);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const G = {
  sidewalk: new THREE.BoxGeometry(CELL - ROAD, 0.3, CELL - ROAD),
  grass: new THREE.BoxGeometry(CELL - ROAD, 0.1, CELL - ROAD),
  trunk: new THREE.CylinderGeometry(0.25, 0.32, 2.2, 6),
  crown: new THREE.IcosahedronGeometry(2, 0),
  pole: new THREE.CylinderGeometry(0.15, 0.2, 7, 6),
  arm: new THREE.BoxGeometry(0.2, 0.2, 3.4),
  lamp: new THREE.BoxGeometry(0.9, 0.25, 0.9),
  pool: new THREE.PlaneGeometry(18, 18),
};
const M = {
  sidewalk: new THREE.MeshStandardMaterial({ color: 0x3b4152, roughness: 0.95 }),
  grass: new THREE.MeshStandardMaterial({ color: 0x1d3a2b, roughness: 1 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x3a2a20 }),
  crown: new THREE.MeshStandardMaterial({ color: 0x24563a, flatShading: true }),
  pole: new THREE.MeshStandardMaterial({ color: 0x2a2f3d, metalness: 0.4, roughness: 0.6 }),
  lamp: new THREE.MeshStandardMaterial({ color: 0xffb04f, emissive: 0xffb04f, emissiveIntensity: 2 }),
  pool: new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }),
};

/* ---------- procedural city ---------- */
const lotCache = new Map();
function lotInfo(i, j) {
  const k = i + ',' + j;
  let L = lotCache.get(k);
  if (L) return L;
  const nearSpawn = (i === 0 || i === -1) && (j === 0 || j === -1);
  const park = !nearSpawn && hash(i, j, 1) < 0.1;
  const x0 = i * CELL, z0 = j * CELL;
  L = { park, boxes: [], circles: [], trees: [] };
  if (park) {
    const n = 4 + Math.floor(hash(i, j, 2) * 5);
    for (let t = 0; t < n; t++) {
      const tr = { x: x0 + 13 + hash(i, j, 10 + t) * 34, z: z0 + 13 + hash(i, j, 30 + t) * 34, s: 0.8 + hash(i, j, 50 + t) * 0.6 };
      L.trees.push(tr);
      L.circles.push({ x: tr.x, z: tr.z, r: 0.6 * tr.s });
    }
    L.circles.push({ x: x0 + 9, z: z0 + 9, r: 0.3 });
  } else {
    L.boxes.push({ minX: x0 + HALF + 1.5, maxX: x0 + CELL - HALF - 1.5, minZ: z0 + HALF + 1.5, maxZ: z0 + CELL - HALF - 1.5 });
  }
  if (lotCache.size > 8000) lotCache.clear();
  lotCache.set(k, L);
  return L;
}

function buildingGeo(cx, cz, w, d, h) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(cx, h / 2, cz);
  const uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const idx = f * 4 + v;
    if (f === 2 || f === 3) uv.setXY(idx, 0.01, 0.01);
    else uv.setXY(idx, uv.getX(idx) * (f < 2 ? d : w) / 12, uv.getY(idx) * h / 24);
  }
  return g;
}

const lots = new Map();
function buildLot(i, j) {
  const L = lotInfo(i, j);
  const grp = new THREE.Group();
  const x0 = i * CELL, z0 = j * CELL, cx = x0 + CELL / 2, cz = z0 + CELL / 2;
  const r = n => hash(i, j, 100 + n);
  if (L.park) {
    const gm = new THREE.Mesh(G.grass, M.grass); gm.position.set(cx, 0.05, cz); grp.add(gm);
    for (const t of L.trees) {
      const tk = new THREE.Mesh(G.trunk, M.trunk); tk.position.set(t.x, 1.1 * t.s, t.z); tk.scale.setScalar(t.s); grp.add(tk);
      const cr = new THREE.Mesh(G.crown, M.crown); cr.position.set(t.x, 3.2 * t.s, t.z); cr.scale.setScalar(t.s); grp.add(cr);
    }
  } else {
    const sw = new THREE.Mesh(G.sidewalk, M.sidewalk); sw.position.set(cx, 0.15, cz); grp.add(sw);
    const district = 0.5 + 0.5 * Math.sin(i * 0.21 + 1.3) * Math.cos(j * 0.17 - 0.4);
    const a = 9, b = 51, m = 30 + (r(2) - 0.5) * 10, mode = r(0);
    let rects;
    if (mode < 0.3) rects = [[a, a, b, b]];
    else if (mode < 0.65) rects = r(1) < 0.5 ? [[a, a, m, b], [m, a, b, b]] : [[a, a, b, m], [a, m, b, b]];
    else rects = [[a, a, m, m], [m, a, b, m], [a, m, m, b], [m, m, b, b]];
    const parts = [];
    rects.forEach((rc, k) => {
      const w = rc[2] - rc[0] - 1, d = rc[3] - rc[1] - 1;
      const h = 8 + r(10 + k) * 22 + district * district * 75 * r(30 + k);
      const px = x0 + (rc[0] + rc[2]) / 2, pz = z0 + (rc[1] + rc[3]) / 2;
      parts.push(buildingGeo(px, pz, w, d, h));
      if (r(20 + k) < 0.55) parts.push(buildingGeo(px + (r(40 + k) - 0.5) * w * 0.3, pz, w * 0.3, d * 0.3, h + 1.6));
    });
    const merged = mergeGeometries(parts);
    parts.forEach(p => p.dispose());
    grp.add(new THREE.Mesh(merged, buildingMats[Math.floor(r(9) * buildingMats.length)]));
    grp.userData.geo = merged;
  }
  const pole = new THREE.Mesh(G.pole, M.pole); pole.position.set(x0 + 9, 3.5, z0 + 9); grp.add(pole);
  const arm = new THREE.Mesh(G.arm, M.pole); arm.position.set(x0 + 7.8, 7, z0 + 7.8); arm.rotation.y = Math.PI / 4; grp.add(arm);
  const lamp = new THREE.Mesh(G.lamp, M.lamp); lamp.position.set(x0 + 6.6, 6.85, z0 + 6.6); lamp.rotation.y = Math.PI / 4; grp.add(lamp);
  const pool = new THREE.Mesh(G.pool, M.pool); pool.rotation.x = -Math.PI / 2; pool.position.set(x0 + 5, 0.06, z0 + 5); grp.add(pool);
  scene.add(grp);
  return grp;
}

let lastCellKey = '';
function updateCity(x, z) {
  const ci = Math.floor(x / CELL), cj = Math.floor(z / CELL), key = ci + ',' + cj;
  if (key === lastCellKey) return;
  lastCellKey = key;
  for (let i = ci - VIEW; i <= ci + VIEW; i++) for (let j = cj - VIEW; j <= cj + VIEW; j++) {
    const k = i + ',' + j;
    if (!lots.has(k)) lots.set(k, { i, j, g: buildLot(i, j) });
  }
  for (const [k, l] of lots) {
    if (Math.abs(l.i - ci) > VIEW + 1 || Math.abs(l.j - cj) > VIEW + 1) {
      scene.remove(l.g);
      if (l.g.userData.geo) l.g.userData.geo.dispose();
      lots.delete(k);
    }
  }
  ground.position.set(Math.round(x / CELL) * CELL, 0, Math.round(z / CELL) * CELL);
}

function solidAt(x, z, inflate) {
  const L = lotInfo(Math.floor(x / CELL), Math.floor(z / CELL));
  for (const b of L.boxes) if (x > b.minX - inflate && x < b.maxX + inflate && z > b.minZ - inflate && z < b.maxZ + inflate) return true;
  return false;
}
function clearLine(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1, d = Math.hypot(dx, dz), n = Math.ceil(d / 3);
  for (let s = 1; s < n; s++) if (solidAt(x1 + dx * s / n, z1 + dz * s / n, 1.6)) return false;
  return true;
}

/* ---------- cars ---------- */
const glassMat = new THREE.MeshStandardMaterial({ color: 0x0d1220, roughness: 0.2, metalness: 0.6 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff3d6, emissiveIntensity: 2 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0xff2030, emissive: 0xff2030, emissiveIntensity: 1.6 });
const sirenRed = new THREE.MeshStandardMaterial({ color: 0xff3b4e, emissive: 0xff3b4e, emissiveIntensity: 3 });
const sirenBlue = new THREE.MeshStandardMaterial({ color: 0x3b8bff, emissive: 0x3b8bff, emissiveIntensity: 3 });
const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 14);

function makeCar(isCop) {
  const root = new THREE.Group(), body = new THREE.Group();
  root.add(body);
  const paint = new THREE.MeshStandardMaterial({ color: isCop ? 0x161b2c : 0xffc531, roughness: 0.35, metalness: 0.3 });
  const add = (geo, mat, x, y, z, parent = body) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  add(new THREE.BoxGeometry(2.2, 0.75, 4.6), paint, 0, 0.75, 0);
  add(new THREE.BoxGeometry(1.9, 0.7, 2.3), glassMat, 0, 1.45, -0.25);
  add(new THREE.BoxGeometry(1.85, 0.08, 2.0), paint, 0, 1.82, -0.25);
  if (isCop) {
    const white = new THREE.MeshStandardMaterial({ color: 0xe9ecf3, roughness: 0.4 });
    add(new THREE.BoxGeometry(2.24, 0.45, 2.2), white, 0, 0.78, 0.1);
    add(new THREE.BoxGeometry(0.7, 0.22, 0.4), sirenRed, -0.4, 1.97, -0.25);
    add(new THREE.BoxGeometry(0.7, 0.22, 0.4), sirenBlue, 0.4, 1.97, -0.25);
  } else {
    const check = new THREE.MeshStandardMaterial({ color: 0x161b2c });
    add(new THREE.BoxGeometry(2.24, 0.14, 4.0), check, 0, 0.95, 0);
  }
  add(new THREE.BoxGeometry(0.5, 0.2, 0.08), headMat, -0.7, 0.85, 2.31);
  add(new THREE.BoxGeometry(0.5, 0.2, 0.08), headMat, 0.7, 0.85, 2.31);
  add(new THREE.BoxGeometry(0.5, 0.18, 0.08), tailMat, -0.7, 0.9, -2.31);
  add(new THREE.BoxGeometry(0.5, 0.18, 0.08), tailMat, 0.7, 0.9, -2.31);
  const wheels = [];
  for (const [x, z] of [[-1.05, 1.5], [1.05, 1.5], [-1.05, -1.5], [1.05, -1.5]]) {
    const pivot = new THREE.Group(); pivot.position.set(x, 0.45, z); root.add(pivot);
    const w = new THREE.Mesh(wheelGeo, tireMat); w.rotation.z = Math.PI / 2; pivot.add(w);
    wheels.push({ pivot, w, front: z > 0 });
  }
  scene.add(root);
  return { root, body, wheels, x: 0, z: 0, h: 0, vx: 0, vz: 0, steer: 0, vf: 0, spin: 0 };
}

function stepCar(c, inp, P, dt) {
  const fx = Math.sin(c.h), fz = Math.cos(c.h), lx = Math.cos(c.h), lz = -Math.sin(c.h);
  let vf = c.vx * fx + c.vz * fz, vl = c.vx * lx + c.vz * lz;
  if (inp.throttle > 0) vf += (vf < -0.5 ? P.brake : P.acc) * inp.throttle * dt;
  else if (inp.throttle < 0) vf -= (vf > 0.5 ? P.brake : P.acc * 0.6) * -inp.throttle * dt;
  vf -= vf * (inp.throttle === 0 ? 0.55 : 0.12) * dt;
  if (inp.hand) vf -= vf * 1.1 * dt;
  vf = clamp(vf, -P.max * 0.35, P.max);
  vl *= Math.pow(inp.hand ? 0.3 : 0.002, dt);
  c.steer += (inp.steer - c.steer) * Math.min(1, dt * 9);
  const sp = Math.abs(vf);
  const scale = Math.min(1, sp / 7) * (1 - 0.4 * Math.min(1, sp / P.max));
  c.h = wrapA(c.h - c.steer * P.steer * scale * Math.sign(vf || 1) * (inp.hand ? 1.6 : 1) * dt);
  c.vx = fx * vf + lx * vl;
  c.vz = fz * vf + lz * vl;
  c.x += c.vx * dt;
  c.z += c.vz * dt;
  c.vf = vf;
  c.slip = Math.abs(vl);
}

function resolveVel(c, nx, nz) {
  const vn = c.vx * nx + c.vz * nz;
  if (vn >= 0) return 0;
  c.vx -= 1.3 * vn * nx; c.vz -= 1.3 * vn * nz;
  c.vx *= 0.86; c.vz *= 0.86;
  return -vn;
}
function collideWorld(c, rad) {
  let imp = 0;
  const ci = Math.floor(c.x / CELL), cj = Math.floor(c.z / CELL);
  for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
    const L = lotInfo(ci + di, cj + dj);
    for (const b of L.boxes) {
      const px = clamp(c.x, b.minX, b.maxX), pz = clamp(c.z, b.minZ, b.maxZ);
      const dx = c.x - px, dz = c.z - pz, d2 = dx * dx + dz * dz;
      if (d2 >= rad * rad) continue;
      let d = Math.sqrt(d2), nx, nz;
      if (d < 1e-4) {
        const l = c.x - b.minX, rr = b.maxX - c.x, t = c.z - b.minZ, bb = b.maxZ - c.z, m = Math.min(l, rr, t, bb);
        if (m === l) { nx = -1; nz = 0; d = -l; } else if (m === rr) { nx = 1; nz = 0; d = -rr; }
        else if (m === t) { nx = 0; nz = -1; d = -t; } else { nx = 0; nz = 1; d = -bb; }
      } else { nx = dx / d; nz = dz / d; }
      c.x += nx * (rad - d); c.z += nz * (rad - d);
      imp = Math.max(imp, resolveVel(c, nx, nz));
    }
    for (const o of L.circles) {
      const dx = c.x - o.x, dz = c.z - o.z, d = Math.hypot(dx, dz), R = rad + o.r;
      if (d >= R || d < 1e-4) continue;
      const nx = dx / d, nz = dz / d;
      c.x += nx * (R - d); c.z += nz * (R - d);
      imp = Math.max(imp, resolveVel(c, nx, nz));
    }
  }
  return imp;
}

function syncCar(c, dt) {
  c.root.position.set(c.x, 0, c.z);
  c.root.rotation.y = c.h;
  const sp = Math.min(1, Math.abs(c.vf) / 40);
  c.body.rotation.z += (c.steer * sp * 0.07 - c.body.rotation.z) * Math.min(1, dt * 6);
  c.spin += c.vf * dt / 0.45;
  for (const w of c.wheels) {
    w.w.rotation.x = c.spin;
    if (w.front) w.pivot.rotation.y = -c.steer * 0.45;
  }
}

/* ---------- game state ---------- */
const PLAYER_P = { max: 50, acc: 27, brake: 48, steer: 2.5 };
const player = makeCar(false);
const head = new THREE.SpotLight(0xfff0d0, 60, 70, 0.5, 0.6, 1.2);
head.position.set(0, 1.2, 2.2);
const headTarget = new THREE.Object3D(); headTarget.position.set(0, 0, 18);
player.root.add(head, headTarget);
head.target = headTarget;
const siren = new THREE.PointLight(0xff3b4e, 0, 45, 1.2);
scene.add(siren);

const keys = {};
let state = 'menu', cops = [], time = 0, dist = 0, health = 100, bust = 0, level = 1, spawnT = 0, shake = 0, flashV = 0;
let best = Number(localStorage.getItem('pursuit-best') || 0);
const $ = id => document.getElementById(id);
const ui = { hud: $('hud'), dist: $('dist'), time: $('time'), cops: $('cops'), speed: $('speed'), hp: $('hpbar'), bust: $('bust'), bustbar: $('bustbar'), stars: [...$('stars').children], flash: $('flash') };
$('bestMenu').textContent = best ? `Best run: ${Math.floor(best)} m` : '';

const fmtTime = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;

function spawnCop(minD = 150, maxD = 210) {
  const c = makeCar(true);
  const ang = player.h + Math.PI + (Math.random() - 0.5) * Math.PI * 1.3;
  const d = minD + Math.random() * (maxD - minD);
  let x = player.x + Math.sin(ang) * d, z = player.z + Math.cos(ang) * d;
  if (Math.abs(x / CELL - Math.round(x / CELL)) < Math.abs(z / CELL - Math.round(z / CELL))) x = Math.round(x / CELL) * CELL;
  else z = Math.round(z / CELL) * CELL;
  c.x = x; c.z = z;
  c.h = Math.atan2(player.x - x, player.z - z);
  Object.assign(c, { think: 0, los: true, wp: null, stuck: 0, reverse: 0 });
  cops.push(c);
}
function removeCop(c) { scene.remove(c.root); cops = cops.filter(o => o !== c); }

function reset() {
  cops.slice().forEach(removeCop);
  Object.assign(player, { x: 0, z: 0, h: 0, vx: 0, vz: 0, steer: 0, vf: 0 });
  time = 0; dist = 0; health = 100; bust = 0; level = 1; spawnT = 0;
  spawnCop(70, 90);
}

function copAI(c, dt) {
  const dx = player.x - c.x, dz = player.z - c.z, d = Math.hypot(dx, dz);
  const lead = d < 15 ? 0 : Math.min(d / 45, 1);
  let tx = player.x + player.vx * lead, tz = player.z + player.vz * lead;
  c.think -= dt;
  if (c.think <= 0) {
    c.think = 0.25 + Math.random() * 0.1;
    c.los = clearLine(c.x, c.z, tx, tz);
    if (!c.los) {
      const gi = Math.round(c.x / CELL), gj = Math.round(c.z / CELL);
      let bestS = Infinity, bestP = null;
      for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) {
        const ix = (gi + a) * CELL, iz = (gj + b) * CELL, dc = Math.hypot(ix - c.x, iz - c.z);
        if (dc < 6 || !clearLine(c.x, c.z, ix, iz)) continue;
        const s = dc * 0.3 + Math.hypot(ix - player.x, iz - player.z);
        if (s < bestS) { bestS = s; bestP = { x: ix, z: iz }; }
      }
      c.wp = bestP;
    }
  }
  if (!c.los && c.wp) { tx = c.wp.x; tz = c.wp.z; }
  const diff = wrapA(Math.atan2(tx - c.x, tz - c.z) - c.h);
  let steer = clamp(-diff * 2.5, -1, 1), throttle = 1;
  const sp = Math.hypot(c.vx, c.vz);
  if (Math.abs(diff) > 1.1 && sp > 24) throttle = -0.7;
  if (c.reverse > 0) { c.reverse -= dt; throttle = -1; steer = -steer; }
  else if (sp < 2.5 && state === 'play') { c.stuck += dt; if (c.stuck > 1.1) { c.reverse = 0.9; c.stuck = 0; } }
  else c.stuck = 0;
  const max = Math.min(54, 45 + level * 1.6) * (d > 110 ? 1.18 : 1);
  return { inp: { throttle, steer, hand: false }, P: { max, acc: 29, brake: 42, steer: 2.7 }, d };
}

function carPair(a, b, R, onHit) {
  const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
  if (d >= R || d < 1e-4) return;
  const nx = dx / d, nz = dz / d, o = (R - d) / 2;
  a.x -= nx * o; a.z -= nz * o; b.x += nx * o; b.z += nz * o;
  const rel = (a.vx - b.vx) * nx + (a.vz - b.vz) * nz;
  if (rel <= 0) return;
  const j = rel * 0.75;
  a.vx -= nx * j; a.vz -= nz * j; b.vx += nx * j; b.vz += nz * j;
  if (onHit) onHit(rel);
}

function damage(n) {
  health = Math.max(0, health - n);
  flashV = Math.min(0.9, flashV + n / 25);
  shake = Math.min(1.2, shake + n / 20);
}

function endGame(kind) {
  state = 'over';
  if (dist > best) { best = dist; localStorage.setItem('pursuit-best', String(best)); }
  $('overTitle').textContent = kind === 'busted' ? 'Busted' : 'Wrecked';
  $('overSub').textContent = kind === 'busted' ? 'They boxed you in. Keep moving next time.' : 'Your car gave out. Fewer walls, more road.';
  $('rDist').textContent = `${Math.floor(dist)} m`;
  $('rTime').textContent = fmtTime(time);
  $('rBest').textContent = `${Math.floor(best)} m`;
  $('over').hidden = false;
  ui.hud.hidden = true;
  $('againBtn').focus();
}

function start() {
  reset();
  state = 'play';
  $('menu').hidden = true; $('over').hidden = true; $('pause').hidden = true;
  ui.hud.hidden = false;
  canvas.focus();
}
function togglePause() {
  if (state === 'play') { state = 'paused'; $('pause').hidden = false; $('resumeBtn').focus(); }
  else if (state === 'paused') { state = 'play'; $('pause').hidden = true; }
}
$('startBtn').onclick = start;
$('againBtn').onclick = start;
$('resumeBtn').onclick = togglePause;

const GAME_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  if (e.code === 'Enter' && (state === 'menu' || state === 'over')) { e.preventDefault(); start(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });

/* ---------- minimap ---------- */
const mapCv = $('map'), mctx = mapCv.getContext('2d');
function drawMap(blink) {
  const S = mapCv.width, cx = S / 2, sc = S / 320;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.fillStyle = '#2a3150'; mctx.fillRect(0, 0, S, S);
  const ch = Math.cos(player.h), sh = Math.sin(player.h);
  mctx.setTransform(-ch * sc, -sh * sc, sh * sc, -ch * sc, cx, cx);
  const ci = Math.floor(player.x / CELL), cj = Math.floor(player.z / CELL);
  for (let i = ci - 4; i <= ci + 4; i++) for (let j = cj - 4; j <= cj + 4; j++) {
    const L = lotInfo(i, j);
    mctx.fillStyle = L.park ? '#1d3a2b' : '#0f1428';
    mctx.fillRect(i * CELL + HALF - player.x, j * CELL + HALF - player.z, CELL - ROAD, CELL - ROAD);
  }
  for (const c of cops) {
    let dx = c.x - player.x, dz = c.z - player.z;
    const d = Math.hypot(dx, dz), lim = 150;
    if (d > lim) { dx *= lim / d; dz *= lim / d; }
    mctx.fillStyle = blink ? '#ff3b4e' : '#3b8bff';
    mctx.beginPath(); mctx.arc(dx, dz, 6, 0, Math.PI * 2); mctx.fill();
  }
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.fillStyle = '#ffc531';
  mctx.beginPath(); mctx.moveTo(cx, cx - 12); mctx.lineTo(cx + 8, cx + 9); mctx.lineTo(cx - 8, cx + 9); mctx.closePath(); mctx.fill();
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 8, -14), lookAt = new THREE.Vector3();
let hudT = 0, menuT = 0;
reset();
camera.position.copy(camPos);

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const blink = Math.floor(performance.now() / 180) % 2 === 0;
  sirenRed.emissiveIntensity = blink ? 4 : 0.2;
  sirenBlue.emissiveIntensity = blink ? 0.2 : 4;

  if (state === 'play' || state === 'over' || state === 'menu') {
    const sim = state !== 'menu';
    if (sim) {
      const alive = state === 'play';
      const inp = {
        throttle: alive ? ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0) : 0,
        steer: alive ? ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0) : 0,
        hand: alive && !!keys.Space,
      };
      const px = player.x, pz = player.z;
      stepCar(player, inp, PLAYER_P, dt);
      const imp = collideWorld(player, 1.7);
      if (imp > 9 && alive) damage((imp - 9) * 1.1);
      if (imp > 4) shake = Math.min(1.2, shake + imp / 60);
      if (alive) { dist += Math.hypot(player.x - px, player.z - pz); time += dt; }

      let nearest = Infinity, nearestCop = null;
      for (const c of cops.slice()) {
        const { inp: ci, P, d } = copAI(c, dt);
        stepCar(c, ci, P, dt);
        collideWorld(c, 1.7);
        if (d > 270) { removeCop(c); continue; }
        if (d < nearest) { nearest = d; nearestCop = c; }
      }
      for (let a = 0; a < cops.length; a++) for (let b = a + 1; b < cops.length; b++) carPair(cops[a], cops[b], 3.4);
      for (const c of cops) carPair(player, c, 3.6, rel => { if (alive && rel > 4) damage(rel * 0.7); });

      if (alive) {
        level = Math.min(5, 1 + Math.floor(time / 25));
        const want = [0, 2, 3, 5, 7, 9][level];
        spawnT -= dt;
        if (cops.length < want && spawnT <= 0) { spawnCop(); spawnT = 3; }
        const sp = Math.hypot(player.vx, player.vz);
        if (sp < 6 && nearest < 9) bust += dt; else bust = Math.max(0, bust - dt * 1.5);
        if (nearest > 60) health = Math.min(100, health + dt * 2);
        if (bust >= 2.5) endGame('busted');
        else if (health <= 0) endGame('wrecked');
      }
      if (nearestCop) {
        siren.position.set(nearestCop.x, 3, nearestCop.z);
        siren.color.setHex(blink ? 0xff3b4e : 0x3b8bff);
        siren.intensity = 40;
      } else siren.intensity = 0;
    }
    syncCar(player, dt);
    for (const c of cops) syncCar(c, dt);
    updateCity(player.x, player.z);

    const fx = Math.sin(player.h), fz = Math.cos(player.h);
    if (state === 'menu') {
      menuT += dt * 0.25;
      camera.position.set(player.x + Math.sin(menuT) * 15, 6, player.z + Math.cos(menuT) * 15);
      camera.lookAt(player.x, 1.5, player.z);
    } else {
      const sp = Math.hypot(player.vx, player.vz);
      const back = 11 + sp * 0.06;
      camPos.set(player.x - fx * back, 5.5 + sp * 0.03, player.z - fz * back);
      camera.position.lerp(camPos, 1 - Math.exp(-6 * dt));
      lookAt.set(player.x + fx * 6, 1.2, player.z + fz * 6);
      if (shake > 0.01) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
        shake *= Math.exp(-6 * dt);
      }
      camera.lookAt(lookAt);
      const fov = 62 + Math.min(1, sp / 50) * 12;
      if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }
    }
  }

  flashV *= Math.exp(-4 * dt);
  ui.flash.style.opacity = flashV.toFixed(3);

  if (state === 'play') {
    hudT -= dt;
    if (hudT <= 0) {
      hudT = 0.06;
      ui.dist.textContent = `${Math.floor(dist)} m`;
      ui.time.textContent = fmtTime(time);
      ui.cops.textContent = cops.length;
      ui.speed.textContent = Math.round(Math.hypot(player.vx, player.vz) * 3.6);
      ui.hp.style.width = `${health}%`;
      ui.hp.style.background = health < 30 ? 'var(--red)' : 'var(--taxi)';
      ui.stars.forEach((s, k) => s.classList.toggle('on', k < level));
      ui.bust.style.opacity = bust > 0.05 ? 1 : 0;
      ui.bustbar.style.width = `${(bust / 2.5) * 100}%`;
    }
    drawMap(blink);
  }
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
